[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --timeout=120
    --alluredir=allure-results
    --clean-alluredir
    --html=reports/report.html
    --self-contained-html
    --cov=app
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage.xml
markers =
    smoke: 核心冒烟用例
    regression: 回归用例
    contract: 契约测试
    db: 数据库校验
    mock: 外部依赖 Mock
    property: 基于 Hypothesis 的属性测试
    security: 接口安全测试
    external: 依赖第三方网络的用例
